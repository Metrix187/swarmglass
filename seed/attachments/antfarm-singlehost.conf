# single-host development colony, 2014 edition
# everything on localhost, one forager, no peer queen
# archive ref: {{canary}}

[queen]
name            = queen-dev
listen          = 127.0.0.1:7420
bus             = 127.0.0.1:7421
epoch_file      = /var/lib/antfarm/epoch
assign_timeout  = 60
hb_interval     = 10
hb_miss_evict   = 3
hosts_file      = /etc/antfarm/hosts.yaml

[forager]
name            = forager-dev
queen           = 127.0.0.1:7420
bus             = 127.0.0.1:7421
slots           = 1
capabilities    = fetch,convert,index
cm_cache_ttl    = 30
model.strict    = true

[phero]
listen          = 127.0.0.1:7421
data_dir        = /var/lib/phero
trail_log_size  = 1000

[cmsync]
listen          = 127.0.0.1:7422
sync_interval   = 2

[toolreg]
listen          = 127.0.0.1:7423
manifest        = /etc/antfarm/manifest.json
schema          = toolreg/2
