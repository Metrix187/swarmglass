# nginx equivalents of the two caddy layouts. tls via certbot or your existing setup.

# ---------- Option A: subdomain ----------
server {
    listen 443 ssl http2;
    server_name swarmglass.quantara.cv;
    ssl_certificate     /etc/letsencrypt/live/swarmglass.quantara.cv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swarmglass.quantara.cv/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # console paths never resolve on the public name
    location ~ ^/(__quantara/|login|logout|ui/) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 128k;   # the app rejects >64k bodies anyway
    }

    access_log /var/log/nginx/swarmglass.access.log combined buffer=32k flush=5s;
}

server {
    listen 80;
    server_name swarmglass.quantara.cv;
    return 301 https://$host$request_uri;
}

# ---------- research console: separate name, allowlist + basic auth ----------
server {
    listen 443 ssl http2;
    server_name research.swarmglass.quantara.cv;
    ssl_certificate     /etc/letsencrypt/live/research.swarmglass.quantara.cv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research.swarmglass.quantara.cv/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_tokens off;

    # TODO: your vpn / tailnet ranges
    allow 100.64.0.0/10;
    allow 10.0.0.0/8;
    deny all;

    auth_basic "swarmglass research";
    auth_basic_user_file /etc/nginx/swarmglass.htpasswd;   # htpasswd -B -c /etc/nginx/swarmglass.htpasswd researcher

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

